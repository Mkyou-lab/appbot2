{% extends 'base.html' %}
{% block title %}Login — MK Sniper Bot{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Welcome Back 👋</h2>
        <p class="subtitle">Log in to access your trading signals</p>

        <form method="POST" action="{{ url_for('login_page') }}">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" name="username" class="form-control" placeholder="admin or your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">🔑 Login</button>
        </form>

        <div class="auth-divider">or</div>

        <a href="https://t.me/{{ config.get('ADMIN_USERNAME','Mkg12333').replace('@','') }}" target="_blank" class="btn btn-secondary btn-block">
            📱 Open Telegram Bot
        </a>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('register_page') }}">Register Now</a>
        </div>
    </div>
</div>
{% endblock %}
