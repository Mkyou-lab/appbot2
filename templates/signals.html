{% extends 'base.html' %}
{% block content %}
<div class="w-full max-w-2xl mx-auto bg-slate-900 rounded-3xl p-6 md:p-10 border border-cyan-500/30 shadow-[0_0_50px_rgba(6,182,212,0.15)] relative overflow-hidden">
    
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-cyan-500 to-transparent opacity-50"></div>

    <div class="text-center mb-10">
        <h1 class="text-4xl font-black font-orbitron text-cyan-400 tracking-wider">QUANTUM ENGINE</h1>
        <p class="text-slate-400 text-sm mt-2">v47.0 Institutional Analysis Terminal</p>
    </div>

    <!-- Configuration Selection -->
    <div id="step-1" class="space-y-6">
        <div>
            <label class="block font-orbitron text-cyan-400 text-sm mb-2"><i class="fas fa-clock mr-1"></i> EXPIRATION TIMEFRAME</label>
            <select id="duration" class="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-white font-bold outline-none focus:border-cyan-500 transition shadow-inner">
                <option value="1m">1 Minute Sniper (M1)</option>
                <option value="2m">2 Minute Precision (M2)</option>
                <option value="5m">5 Minute Standard (M5)</option>
                <option value="15m">15 Minute Swing (M15)</option>
            </select>
        </div>
        
        <div>
            <label class="block font-orbitron text-cyan-400 text-sm mb-2"><i class="fas fa-chart-line mr-1"></i> MARKET ASSET PAIR</label>
            <select id="pair" class="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-white font-bold outline-none focus:border-cyan-500 transition shadow-inner">
                <optgroup label="🔥 Binary OTC Majors">
                    <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
                    <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
                    <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
                    <option value="AUD/USD (OTC)">AUD/USD (OTC)</option>
                    <option value="USD/CAD (OTC)">USD/CAD (OTC)</option>
                </optgroup>
                <optgroup label="🌍 Live Forex">
                    <option value="EUR/GBP">EUR/GBP</option>
                    <option value="EUR/JPY">EUR/JPY</option>
                    <option value="GBP/JPY">GBP/JPY</option>
                    <option value="USD/CHF">USD/CHF</option>
                    <option value="NZD/USD">NZD/USD</option>
                </optgroup>
                <optgroup label="💎 Crypto & Commodities">
                    <option value="BTC/USDT">Bitcoin (BTC/USDT)</option>
                    <option value="ETH/USDT">Ethereum (ETH/USDT)</option>
                    <option value="XAU/USD">Gold (XAU/USD)</option>
                    <option value="BRENT/USD">Oil (BRENT)</option>
                </optgroup>
            </select>
        </div>
        
        <button onclick="analyze()" class="w-full mt-8 py-5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black font-orbitron text-xl rounded-xl transition shadow-lg shadow-cyan-500/30 flex items-center justify-center gap-3">
            <i class="fas fa-bolt"></i> RUN ALGORITHM
        </button>
    </div>

    <!-- Processing Loader -->
    <div id="loading" class="hidden text-center py-16 space-y-6">
        <div class="relative w-24 h-24 mx-auto">
            <div class="absolute inset-0 border-4 border-slate-800 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-cyan-400 rounded-full border-t-transparent animate-spin"></div>
            <i class="fas fa-server absolute inset-0 flex items-center justify-center text-2xl text-cyan-400"></i>
        </div>
        <div>
            <p class="font-mono text-cyan-400 font-bold text-lg" id="logText">Connecting to API...</p>
            <p class="text-xs text-slate-500 mt-2">Bypassing Market Noise</p>
        </div>
    </div>

    <!-- Highly Accurate Result Card -->
    <div id="result" class="hidden space-y-6">
        <div class="border border-slate-700 bg-slate-950/50 p-8 rounded-2xl relative overflow-hidden">
            <!-- Dynamic Background Glow -->
            <div id="bgGlow" class="absolute top-0 right-0 w-32 h-32 blur-3xl opacity-20 rounded-full"></div>

            <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
                <h2 id="resPair" class="text-2xl font-black text-white font-orbitron">--</h2>
                <span class="px-3 py-1 bg-cyan-900/50 text-cyan-400 border border-cyan-500/30 rounded text-xs font-bold font-mono">LIVE MATCH</span>
            </div>
            
            <div class="text-center mb-8">
                <p class="text-xs text-slate-400 font-orbitron mb-2 uppercase tracking-widest">EXECUTED ALGORITHM DECISION</p>
                <div id="resAction" class="text-5xl font-black font-orbitron my-2 drop-shadow-2xl">--</div>
            </div>

            <!-- Technical Data (Makes it look incredibly accurate) -->
            <div class="grid grid-cols-2 gap-4 text-sm font-mono border-t border-slate-800 pt-6">
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-500 block text-xs">RSI (14) Index</span>
                    <span id="resRsi" class="font-bold text-white text-lg">--</span>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-500 block text-xs">Market Trend</span>
                    <span id="resTrend" class="font-bold text-white">--</span>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-500 block text-xs">Entry Volatility</span>
                    <span id="resVol" class="font-bold text-white">--</span>
                </div>
                <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-500 block text-xs">Win Probability</span>
                    <span id="resAcc" class="font-bold text-cyan-400 text-lg">--</span>
                </div>
            </div>
        </div>

        <button onclick="location.reload()" class="w-full py-4 bg-slate-800 hover:bg-slate-700 text-white font-black font-orbitron rounded-xl transition border border-slate-600">
            <i class="fas fa-redo-alt mr-2"></i> SCAN NEW OPPORTUNITY
        </button>
    </div>
</div>

<script>
    async function analyze() {
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');
        
        // App-like realistic loading logs
        const logs = [
            "Syncing MT4/MT5 Feeds...", 
            "Applying EMA Crossover Matrix...", 
            "Reading Order Book Imbalances...",
            "Calculating Quantum Entry Point..."
        ];
        for (let l of logs) {
            document.getElementById('logText').innerText = l;
            await new Promise(r => setTimeout(r, 900));
        }

        const data = { 
            pair: document.getElementById('pair').value, 
            duration: document.getElementById('duration').value 
        };

        const res = await fetch('/api/generate_signal', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const result = await res.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
        
        // Populate specific data
        document.getElementById('resPair').innerText = result.pair;
        
        const actionEl = document.getElementById('resAction');
        const bgGlow = document.getElementById('bgGlow');
        actionEl.innerText = result.action;
        
        // Color coding based on BUY or SELL
        if(result.action.includes("BUY")) {
            actionEl.className = "text-5xl font-black font-orbitron my-2 drop-shadow-2xl text-emerald-500";
            bgGlow.className = "absolute top-0 right-0 w-32 h-32 blur-3xl opacity-30 rounded-full bg-emerald-500";
        } else {
            actionEl.className = "text-5xl font-black font-orbitron my-2 drop-shadow-2xl text-red-500";
            bgGlow.className = "absolute top-0 right-0 w-32 h-32 blur-3xl opacity-30 rounded-full bg-red-500";
        }

        // Fill advanced indicators
        document.getElementById('resAcc').innerText = result.accuracy;
        document.getElementById('resRsi').innerText = result.indicators.rsi;
        document.getElementById('resTrend').innerText = result.indicators.trend;
        document.getElementById('resVol').innerText = result.indicators.volatility;
    }
</script>
{% endblock %}
