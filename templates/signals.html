{% extends 'base.html' %}
{% block content %}
<div class="w-full max-w-xl mx-auto bg-slate-900 rounded-2xl p-8 border border-cyan-500/30 shadow-2xl shadow-cyan-500/10">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-black font-orbitron text-cyan-400">SIGNAL WIZARD</h1>
        <p class="text-slate-400 text-sm">Select Market Pair & Timeframe</p>
    </div>

    <div id="step-1" class="space-y-4">
        <label class="block font-orbitron text-cyan-400 text-sm">EXPIRATION TIMEFRAME</label>
        <select id="duration" class="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-white font-bold outline-none focus:border-cyan-500">
            <option value="1m">1 Minute</option>
            <option value="5m">5 Minutes</option>
            <option value="15m">15 Minutes</option>
        </select>
        
        <label class="block font-orbitron text-cyan-400 text-sm mt-4">ASSET PAIR</label>
        <select id="pair" class="w-full bg-slate-950 border border-slate-700 p-4 rounded-xl text-white font-bold outline-none focus:border-cyan-500">
            <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
            <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
            <option value="BTC/USDT">BTC/USDT</option>
        </select>
        
        <button onclick="analyze()" class="w-full mt-6 py-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black font-orbitron text-lg rounded-xl transition">
            GENERATE SIGNAL
        </button>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-12 space-y-4">
        <i class="fas fa-circle-notch fa-spin text-4xl text-cyan-400"></i>
        <p class="font-mono text-cyan-400" id="logText">Analyzing Market Volume...</p>
    </div>

    <!-- Result -->
    <div id="result" class="hidden text-center space-y-6">
        <div class="border border-emerald-500/40 bg-emerald-950/20 p-6 rounded-2xl">
            <p class="text-xs text-slate-400 font-orbitron">SIGNAL FOUND</p>
            <h2 id="resPair" class="text-2xl font-bold text-white mt-1">--</h2>
            <div id="resAction" class="text-4xl font-black font-orbitron my-4 text-emerald-400">--</div>
            <p class="text-slate-400 text-sm">Win Rate: <span id="resAcc" class="text-cyan-400 font-bold">--</span></p>
        </div>
        <button onclick="location.reload()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold rounded-xl transition">NEW ANALYSIS</button>
    </div>
</div>

<script>
    async function analyze() {
        document.getElementById('step-1').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');
        
        const logs = ["Connecting to OTC Data...", "Scanning Order Books...", "Finalizing Entry..."];
        for (let l of logs) {
            document.getElementById('logText').innerText = l;
            await new Promise(r => setTimeout(r, 1000));
        }

        const data = { 
            pair: document.getElementById('pair').value, 
            duration: document.getElementById('duration').value 
        };

        const res = await fetch('/api/generate_signal', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        const result = await res.json();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('result').classList.remove('hidden');
        
        document.getElementById('resPair').innerText = result.pair;
        document.getElementById('resAction').innerText = result.action;
        document.getElementById('resAcc').innerText = result.accuracy;
    }
</script>
{% endblock %}
